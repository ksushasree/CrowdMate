<style>

.card{background:linear-gradient(145deg,#0f2418 0%,#16301f 60%,#1a3a29 100%);border:1px solid var(--ln);border-radius:16px;padding:16px}.card.hit{cursor:pointer;transition:.15s}.card.hit:hover,.card.sel{border-color:var(--ac)}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:24px;border:0;background:linear-gradient(135deg,#1aa856,#27d070);box-shadow:0 6px 18px #000a;cursor:pointer;z-index:6}

.note{font-size:12px;color:var(--mu);margin:6px 0}.err{background:#3a2a14;border:1px solid #8a6a2a;color:#f3d9a4;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:13px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top button{font-size:22px;background:none;border:0;color:var(--tx)}.two{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body>
<aside id="sb"><div class="logo"><i>🏏</i><div>CrowdMate AI<small>Smart Stadium Management</small></div></div><nav id="nav"></nav></aside>

<script>
/* Add endpoint URLs (JSON) to switch a section from illustrative layout data to live data.

const CONFIG={endpoints:{gates:"",parking:"",alerts:"",scores:"",matches:"",menu:""},orders:"",ai:"",refreshMs:30000};
const PAGES=[["home","🏠","Home"],["matches","🏏","Matches"],["map","🗺️","Stadium Map"],["gates","🚪","Smart Gates"],["parking","🅿️","Parking"],["food","🍔","Food & Drinks"],["orders","🧾","My Orders"],["alerts","🚨","Safety Alerts"],["ai","🤖","AI Assistant"]];
const COL={low:"#22c55e",medium:"#eab308",high:"#ef4444"},NEU="#7c8b83",CLS="#3b4640",L="ABCDEFGH";

 gates:Object.fromEntries([["open","low",40,3,1],["open","medium",95,7,1],["open","high",210,15,0],["open","low",30,2,1],["open","medium",80,6,1],["open","low",25,2,0],["restricted",null,0,0,1],["closed",null,0,0,1]].map((x,i)=>[L[i],{status:x[0],density:x[1],queue:x[2],wait:x[3],accessible:!!x[4],location:LOC[i]+" side"}])),
 parking:[{id:"P1",name:"North Car Park",type:"car",total:400,occupied:312,reserved:20,gate:"A"},{id:"P2",name:"East Car Park",type:"car",total:300,occupied:280,reserved:10,gate:"C"},{id:"P3",name:"South Two-Wheeler Zone",type:"two-wheeler",total:600,occupied:240,reserved:0,gate:"E"},{id:"P4",name:"West Reserved Lot",type:"car",total:120,occupied:60,reserved:60,gate:"G"}],
 alerts:[],
 matches:[{id:"i1",a:"India",b:"West Indies",format:"T20I",venue:"Rajiv Gandhi International Stadium, Hyderabad",date:"2026-10-11",time:"19:00",real:1},{id:"i2",a:"England",b:"South Africa",format:"ODI",venue:"Illustrative Stadium",date:dt(12),time:"14:00"},{id:"i3",a:"New Zealand",b:"Pakistan",format:"Test",venue:"Illustrative Stadium",date:dt(21),time:"09:30"},{id:"i4",a:"Sri Lanka",b:"Bangladesh",format:"ODI",venue:"Illustrative Stadium",date:dt(-9),time:"14:00"},{id:"i5",a:"West Indies",b:"Afghanistan",format:"T20I",venue:"Illustrative Stadium",date:dt(-20),time:"19:00"}],

let LIVE={},ERR={},busy=false,tstamp=null,pending=0;
let S={matches:[],mine:null,cart:{},seat:{stand:"",block:"",row:"",seat:""},orders:[],chat:[],pk:null};
try{Object.assign(S,JSON.parse(localStorage.getItem("cm")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("cm",JSON.stringify(S))}catch(e){}};
const has=k=>{const v=LIVE[k];return v&&(Array.isArray(v)?v.length:Object.keys(v).length)};

const today=()=>new Date().toISOString().slice(0,10);
const mstat=m=>(LIVE.scores?.matchId==m.id)?"Live":m.date>today()?"Upcoming":m.date==today()?"Match day":"Completed";
const sg=m=>({Live:"Live",Upcoming:"Upcoming","Match day":"Upcoming",Completed:"Completed"}[mstat(m)]);

const gcol=g=>!g?NEU:g.status!="open"?CLS:COL[g.density]||NEU;
const gword=g=>!g?"Unknown":g.status=="closed"?"Closed":g.status=="restricted"?"Restricted":g.density?g.density[0].toUpperCase()+g.density.slice(1):"Unknown";

async function load(){const ks=Object.keys(CONFIG.endpoints).filter(k=>CONFIG.endpoints[k]);if(!ks.length)return;busy=true;render();
await Promise.all(ks.map(async k=>{try{const r=await fetch(CONFIG.endpoints[k]);if(!r.ok)throw 0;LIVE[k]=await r.json();delete ERR[k]}catch(e){ERR[k]=1}}));

/* ---------- shared bits ---------- */
function seatForm(full){const s=S.seat;return `<div class="card" style="margin-bottom:14px"><b>📍 My seat</b> <span class="mu">(saved on this device)</span><div class="row"><select onchange="S.seat.stand=this.value;save();render()" aria-label="Stand"><option value="">Stand</option>${[...L].map(l=>`<option ${s.stand==l?"selected":""}>${l}</option>`).join("")}</select><input style="width:90px" placeholder="Block" value="${esc(s.block)}" onchange="S.seat.block=this.value;save();render()">${full?`<input style="width:90px" placeholder="Row" value="${esc(s.row)}" onchange="S.seat.row=this.value;save()"><input style="width:90px" placeholder="Seat" value="${esc(s.seat)}" onchange="S.seat.seat=this.value;save()">`:""}</div></div>`}
const note=k=>"";
const leg=()=>`<div class="leg"><span><i style="background:${COL.low}"></i>Low</span><span><i style="background:${COL.medium}"></i>Medium</span><span><i style="background:${COL.high}"></i>High</span><span><i style="background:${CLS}"></i>Closed</span><span><i style="background:${NEU}"></i>Unknown</span></div>`;
function bestGate(){const s=mySeat(),si=s?L.indexOf(s.stand):null,r={low:0,medium:1,high:2};
return Object.entries(gates()).filter(([,g])=>okGate(g)).map(([id,g])=>{const d=si==null?0:Math.min((L.indexOf(id)-si+8)%8,(si-L.indexOf(id)+8)%8);return{id,g,sc:(r[g.density]??1)*100+(g.wait||0)*2+(g.queue||0)/20+d*5}}).sort((a,b)=>a.sc-b.sc)[0]}
/* ---------- night stadium hero ---------- */
function tick(){document.querySelectorAll('.cd').forEach(e=>{const t=new Date(e.dataset.t);if(isNaN(t)){e.textContent='';return}let s=Math.floor((t-Date.now())/1000);if(s<=0){e.textContent='Start time has passed';return}const p=n=>String(n).padStart(2,'0');e.textContent='⏳ Starts in '+Math.floor(s/86400)+'d '+p(Math.floor(s%86400/3600))+'h '+p(Math.floor(s%3600/60))+'m '+p(s%60)+'s'})}
setInterval(tick,1000);
(function(){const lamp=(x,y,pole)=>`<circle cx='${x}' cy='${y}' r='200' fill='url(#gl)'/><rect x='${x-3}' y='${y+14}' width='6' height='${pole}' fill='#0a1424'/><rect x='${x-36}' y='${y-16}' width='72' height='32' rx='3' fill='#18263f'/>`+[0,1,2,3,4,5].map(i=>`<rect x='${x-31+i*10.5}' y='${y-11}' width='8' height='9' fill='#fffbe0'/><rect x='${x-31+i*10.5}' y='${y+2}' width='8' height='9' fill='#fffbe0'/>`).join('');
const tier=(a,b,c,fill,cr)=>`<path d='M-20,${a} Q800,${c} 1620,${a} L1620,700 L-20,700Z' fill='${fill}' stroke='#3a5f8f' stroke-opacity='.45' stroke-width='2'/>`+(cr?`<path d='M-20,${a} Q800,${c} 1620,${a} L1620,700 L-20,700Z' fill='url(#cr)' opacity='${cr}'/>`:'');
const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='640' viewBox='0 0 1600 640'><defs><linearGradient id='sk' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#010512'/><stop offset='.5' stop-color='#071a38'/><stop offset='1' stop-color='#14395e'/></linearGradient><radialGradient id='gl'><stop offset='0' stop-color='#fff' stop-opacity='.95'/><stop offset='.1' stop-color='#fff6c8' stop-opacity='.55'/><stop offset='.4' stop-color='#8fc4ff' stop-opacity='.17'/><stop offset='1' stop-color='#8fc4ff' stop-opacity='0'/></radialGradient><linearGradient id='fd' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#35b862'/><stop offset='1' stop-color='#0f7436'/></linearGradient><radialGradient id='vg' cx='.5' cy='.5' r='.75'><stop offset='.6' stop-color='#000' stop-opacity='0'/><stop offset='1' stop-color='#000' stop-opacity='.55'/></radialGradient><pattern id='st' width='260' height='170' patternUnits='userSpaceOnUse'><circle cx='20' cy='30' r='1.2' fill='#fff'/><circle cx='95' cy='12' r='.8' fill='#cfe3ff'/><circle cx='160' cy='70' r='1.4' fill='#fff'/><circle cx='230' cy='25' r='.9' fill='#fff'/><circle cx='60' cy='110' r='.9' fill='#cfe3ff'/><circle cx='130' cy='140' r='1.1' fill='#fff'/><circle cx='205' cy='120' r='.8' fill='#fff'/><circle cx='245' cy='90' r='1' fill='#cfe3ff'/></pattern><pattern id='s2' width='190' height='140' patternUnits='userSpaceOnUse'><circle cx='40' cy='50' r='.9' fill='#fff'/><circle cx='120' cy='20' r='1.2' fill='#fff'/><circle cx='165' cy='100' r='.8' fill='#cfe3ff'/><circle cx='80' cy='125' r='1' fill='#fff'/></pattern><pattern id='cr' width='14' height='9' patternUnits='userSpaceOnUse'><circle cx='3' cy='3' r='1.6' fill='#f4c26b'/><circle cx='10' cy='7' r='1.6' fill='#7fb4ff'/><circle cx='7' cy='1' r='1.2' fill='#e8e8e8'/><circle cx='13' cy='4' r='1.2' fill='#ff8a73'/></pattern><clipPath id='fc'><ellipse cx='800' cy='590' rx='900' ry='200'/></clipPath></defs><rect width='1600' height='640' fill='url(#sk)'/><rect width='1600' height='420' fill='url(#st)'/><rect width='1600' height='320' fill='url(#s2)'/>${lamp(150,200,200)}${lamp(420,170,160)}${lamp(1180,170,160)}${lamp(1450,200,200)}${tier(470,0,90,'#10243f',.5)}${tier(490,0,180,'#0d1f37',.7)}${tier(510,0,260,'#12294a',.8)}<ellipse cx='800' cy='330' rx='720' ry='110' fill='url(#gl)' opacity='.2'/><ellipse cx='800' cy='590' rx='900' ry='200' fill='url(#fd)'/><g clip-path='url(#fc)'>${[...Array(9)].map((_,i)=>`<rect x='0' y='${395+i*28}' width='1600' height='14' fill='#fff' opacity='.07'/>`).join('')}</g><ellipse cx='800' cy='590' rx='906' ry='206' fill='none' stroke='#20C765' stroke-width='6' stroke-dasharray='40 14' opacity='.55'/><ellipse cx='800' cy='590' rx='900' ry='200' fill='none' stroke='#fff' stroke-width='3' stroke-dasharray='3 7' opacity='.6'/><ellipse cx='800' cy='600' rx='520' ry='118' fill='none' stroke='#fff' stroke-width='2' stroke-dasharray='8 8' opacity='.35'/><polygon points='768,650 832,650 818,468 782,468' fill='#d9c58f' opacity='.92'/><g stroke='#fff' stroke-width='2' opacity='.8'><line x1='772' y1='612' x2='828' y2='612'/><line x1='786' y1='490' x2='814' y2='490'/></g><g stroke='#f5f0d0' stroke-width='2'><line x1='794' y1='482' x2='794' y2='468'/><line x1='800' y1='482' x2='800' y2='468'/><line x1='806' y1='482' x2='806' y2='468'/></g><rect width='1600' height='640' fill='url(#vg)'/></svg>`;
document.documentElement.style.setProperty('--stadium','url("data:image/svg+xml,'+encodeURIComponent(svg)+'")')})();
/* ---------- hi-detail night stadium ---------- */

function route(t,s,b,label){const si=L.indexOf(s),gi=L.indexOf(t),n=(gi-si+8)%8;label=label||"Gate "+t;const Lb=label[0].toUpperCase()+label.slice(1),be=/s$/.test(label)?"are":"is";

const FAC={restroom:["the restrooms",/rest\s?rooms?|toilets?|wash\s?rooms?|bathrooms?|\bloo\b|lavator\w*/],food:["a food counter",/food (counter|stall|court)|snack (bar|counter)|canteen|kiosk|concession/],aid:["the first-aid point",/first[\s-]?aid|medical|doctor|ambulance|nurse|injur\w*|unwell|faint\w*|\bhurt\b|\bsick\b/],exit:["the exit",/\bexits?\b|way out/]};

function findItems(x){const M=menu(),out=[];ALI.forEach(([n,re])=>{if(re.test(x)){const it=M.find(i=>i.n==n);if(it){const m=x.match(new RegExp("\\b(\\d{1,2}|one|two|three|four|five|six)\\s*(?:x|×)?\\s*(?:\\w+\\s+)?(?:"+re.source+")"));out.push({n:it.n,q:m?(NUM[m[1]]||+m[1]):1})}}});

function reply(t){const d=S.dlg=S.dlg||{},x=t.toLowerCase().replace(/[’]/g,"'").trim(),e=ents(x,!!(d.pend&&d.pend.need=="seat")),seatChanged=remember(e);
